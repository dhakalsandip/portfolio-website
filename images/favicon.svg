<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Vibrant Modern Gradients -->
    <linearGradient id="sdGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <linearGradient id="sdGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6A11CB" />
      <stop offset="100%" stop-color="#2575FC" />
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Group with Shadow Filter -->
  <g filter="url(#softShadow)">
    
    <!-- ================= LETTER S ================= -->
    <path
      d="M 235 175
         H 170
         A 55 55 0 0 0 170 285
         H 215
         A 55 55 0 0 1 215 395
         H 145"
      fill="none"
      stroke="url(#sdGradient1)"
      stroke-width="42"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- ================= LETTER D ================= -->
    <!-- Straight Back Stem -->
    <path
      d="M 285 395 V 175"
      fill="none"
      stroke="url(#sdGradient2)"
      stroke-width="42"
      stroke-linecap="round"
    />

    <!-- D Outer Curve Arc -->
    <path
      d="M 285 175
         H 335
         A 110 110 0 0 1 335 395
         H 285"
      fill="none"
      stroke="url(#sdGradient2)"
      stroke-width="42"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Decorative Central Intersect Node -->
    <circle cx="285" cy="285" r="9" fill="#00F2FE" />
  </g>
</svg>